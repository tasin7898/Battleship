<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <dialog class="dialog-box">
      <div class="inner-dialog-box">
        <div class="dialog-title">Name Your Commander</div>
        <input
          type="text"
          class="name-input"
          placeholder="Commander..."
          maxlength="20"
        />
        <div class="dialog-buttons">
          <button class="dialog-confirm">Set Sail</button>
          <button class="dialog-close">Deserter</button>
        </div>
      </div>
    </dialog>
    <div class="header">
      <div>Battleship</div>
    </div>
    <div class="game">
      <div class="ships-button-container">
        <div class="ships-label">Ships</div>
        <div class="all-ships-container"></div>
        <div class="buttons">
          <button class="rotate-button">⟳ Rotate</button>
          <button class="reset-button">🔄 Reset direction</button>
        </div>
        <div>
          <button class="reset-ships">♻️ Reset Ships</button>
          <button class="randomise-ships">Randomise Ships</button>
        </div>
      </div>
      <div class="player-boards">
        <div class="boards">
          <div class="game-board1" data-board="player1"></div>
          <div class="game-board2" data-board="player2"></div>
        </div>
        <div class="computer-thinking cleared"></div>
        <div class="game-buttons">
          <button class="confirm-fleet">Confirm Fleet & Embark</button>
          <button class="restart-game hidden">Restart Game</button>
        </div>
      </div>
      <div class="all-scores">
        <div class="scores">
          <div class="scoreboard-player1"></div>
          <div class="scoreboard-player2"></div>
        </div>
        <div class="announcements hidden"></div>
        <button class="reset-scores">Reset Scores</button>
      </div>
    </div>
  </body>
</html>
