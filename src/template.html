<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="header">
      <div>Battleship</div>
    </div>
    <div class="game">
      <div class="ships-button-container">
        <div>Ships</div>
        <div class="all-ships-container"></div>
        <div class="buttons">
          <button class="rotate-button">⟳ Rotate</button>
          <button class="reset-button">🔄 Reset direction</button>
        </div>
        <div>
          <button class="reset-ships">♻️ Reset Ships</button>
          <button class="randomise-ships">Randomise Ships</button>
        </div>
      </div>
      <div class="boards">
        <div class="game-board1" data-board="player1"></div>
        <div class="game-board2" data-board="player2"></div>
      </div>
      <div class="all-scores">
        <div class="scores">
          <div class="player1"></div>
          <div class="player2"></div>
        </div>
        <div class="announcements"></div>
      </div>
    </div>
    <button class="confirm-fleet">Confirm Fleet & Start</button>

    <div class="vs-human">Play with a friend</div>
  </body>
</html>
